<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neotone</title>
  <style>
    :root { --ink: #111; --line: #d9d9d9; --muted: #4f4f4f; --green: #2a7a2a; --max: 1180px; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #fff; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 100px;
      overflow: hidden;
      /* Opaque, or content scrolls through and collides with the wordmark.
         Must track the body background. */
      background: #fff;
    }

    /* Mirrors .page exactly, so the marks align to the same left and right
       boundaries as the bordered content blocks beneath them. */
    .nav-inner {
      position: relative;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 48px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Default mode: One is absolutely centred on the page. That takes it out of
       the flex flow, so space-between pins Neotone and neOS to the two
       boundaries. Future mode leaves all four marks in flow. */
    .nav-inner.centre-one .nav-link[data-page="one"] {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Each mark scales about the edge it is aligned to, so its anchored edge
       stays put at any scale, and therefore sits in the same place whether the
       mark is the active one on its own page or reduced on another. Neotone is
       left-aligned, neOS right-aligned, One centred (the default origin).
       The active mark is overridden to a left origin in JS, because it collapses
       to the left boundary. */
    .nav-link[data-page="neotone"] img { transform-origin: left center; }
    .nav-link[data-page="neos"]    img { transform-origin: right center; }

    nav a { display: block; text-decoration: none; cursor: pointer; }

    nav img {
      height: 52px;
      width: auto;
      display: block;
      will-change: transform, opacity;
    }

    .article {
      width: 100%;
      height: 115vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .article-label {
      font-family: sans-serif;
      font-size: 96px;
      font-weight: 700;
      color: rgba(0,0,0,0.15);
    }

    .article-title {
      font-family: sans-serif;
      font-size: 20px;
      font-weight: 400;
      color: rgba(0,0,0,0.4);
      letter-spacing: 0.01em;
    }

    /* ---- Footer ----
       Two quiet bands: sections + search, then utility + place. No column
       headings, no dividers beyond a single hairline. Wraps rather than
       needing breakpoints. */
    .site-footer { background: #000; color: #fff; margin-top: 96px; }
    .footer-inner { max-width: var(--max); margin: 0 auto; padding: 56px 48px; }

    .footer-top {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 32px; flex-wrap: wrap;
    }
    /* Text, not the wordmarks. The nav owns the marks and works them: they
       shrink into the masthead and act as the return mechanism. In a utility
       strip they could only be decoration, and mixing artwork with text gave
       the footer two type systems. */
    .footer-sections { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
    .footer-sections a {
      font-size: 13px; color: #fff; text-decoration: none; cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }
    .footer-sections a:hover { opacity: 0.55; }

    .footer-search { display: flex; align-items: center; width: 260px; max-width: 100%; }
    .footer-search input {
      flex: 1; min-width: 0; background: none; color: #fff;
      border: none; border-bottom: 1px solid rgba(255,255,255,0.28);
      padding: 6px 0; font-size: 13px; font-family: inherit;
    }
    .footer-search input::placeholder { color: rgba(255,255,255,0.35); }
    .footer-search input:focus { outline: none; border-bottom-color: rgba(255,255,255,0.7); }
    .footer-search button {
      background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.55); padding: 6px 0 6px 14px;
      font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .footer-search button:hover { color: #fff; }

    .footer-bottom {
      display: flex; justify-content: space-between; gap: 20px 32px; flex-wrap: wrap;
      margin-top: 44px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.15);
    }
    .footer-utility { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .footer-utility a { font-size: 12px; color: rgba(255,255,255,0.55); text-decoration: none; cursor: pointer; font-family: Arial, Helvetica, sans-serif; }
    .footer-utility a:hover { color: #fff; }
    .footer-meta { margin: 0; font-size: 12px; color: rgba(255,255,255,0.38); font-family: Arial, Helvetica, sans-serif; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-link" data-page="neotone"><img src="../../media/svg_wordmarks/neotone.svg" alt="Neotone"></a>
      <a href="one.html"   class="nav-link" data-page="one"><img src="../../media/svg_wordmarks/one.svg"          alt="One"></a>
      <a href="anima.html" class="nav-link" data-page="anima"><img src="../../media/svg_wordmarks/anima.svg"        alt="Anima"></a>
      <a href="neos.html"  class="nav-link" data-page="neos"><img src="../../media/svg_wordmarks/neOS.svg"         alt="neOS"></a>
    </div>
  </nav>

  <div class="article">
    <div class="article-label">Article 1</div>
    <div class="article-title">Neotone's Kripta Debut</div>
  </div>
  <div class="article">
    <div class="article-label">Article 2</div>
    <div class="article-title">ChatGPT talks about Neotone</div>
  </div>
  <div class="article">
    <div class="article-label">Article 3</div>
    <div class="article-title">I quit my piano lessons and got a Neotone</div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">

      <div class="footer-top">
        <div class="footer-sections">
          <a class="footer-section-link" href="index.html" data-page="neotone">Neotone</a>
          <a class="footer-section-link" href="one.html"   data-page="one">One</a>
          <a class="footer-section-link" href="anima.html" data-page="anima">Anima</a>
          <a class="footer-section-link" href="neos.html"  data-page="neos">neOS</a>
        </div>
        <form class="footer-search" onsubmit="handleSearch(event)">
          <input type="search" placeholder="Search" />
          <button type="submit" aria-label="Search">&rarr;</button>
        </form>
      </div>

      <div class="footer-bottom">
        <div class="footer-utility">
          <a onclick="utilityLink('About')">About</a>
          <a onclick="utilityLink('Workshop')">Workshop</a>
          <a onclick="utilityLink('Contact')">Contact</a>
          <a onclick="utilityLink('FAQ')">FAQ</a>
          <a onclick="utilityLink('Terms')">Terms</a>
          <a onclick="utilityLink('Privacy')">Privacy</a>
        </div>
        <p class="footer-meta">Neotone, Budapest</p>
      </div>

    </div>
  </footer>

  <script>
    /* ---- Future-products mode ----
       Anima has not shipped, so it is absent from the nav by default and
       reinstated with ?future=show. The flag propagates across nav clicks so
       the whole site can be browsed in its future state, and the URL stays
       shareable. Visiting anima.html implies the mode, since a page's own
       mark must be present for the return mechanism to work.

       ACTIVE is derived from the rendered nav rather than hardcoded, because
       removing Anima shifts every index after it. */
    const PAGE   = 'neotone';
    const FUTURE_PARAM = new URLSearchParams(location.search).get('future');
    const FUTURE = PAGE === 'anima' ||
      (FUTURE_PARAM !== null && !['hide', '0', 'false'].includes(FUTURE_PARAM));

    const navInner = document.querySelector('.nav-inner');

    if (!FUTURE) {
      // nav mark and footer entry alike
      document.querySelectorAll('[data-page="anima"]').forEach(el => el.remove());
      navInner.classList.add('centre-one');
    }
    const navQuery = FUTURE ? '?future=show' : '';

    const TRANSITION_MS = 600;
    const BASE_SCALE    = 0.58;
    const TRANSITION_PX = 90;
    const SLIDE_PX      = 120;

    const navLinks = document.querySelectorAll('.nav-link');
    const navItems = Array.from(navLinks).map(a => a.querySelector('img'));
    const ACTIVE   = Math.max(0, [...navLinks].findIndex(a => a.dataset.page === PAGE));
    const inactiveScale = BASE_SCALE;   // every page reduces its non-active marks

    /* The active mark scales about its LEFT edge, not its centre. Neotone is
       already sitting on the content-left boundary and never slides, so with a
       centre origin it would drift right as it shrank and then slide back. With
       a left origin it simply shrinks in place, and for the marks that do slide
       the target becomes a plain difference of left edges. */
    if (navItems[ACTIVE]) navItems[ACTIVE].style.transformOrigin = 'left center';

    let slideDistance = null;

    navLinks[ACTIVE].addEventListener('click', e => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    navLinks.forEach((link, i) => {
      if (i === ACTIVE) return;
      link.addEventListener('click', e => {
        e.preventDefault();
        sessionStorage.setItem('prevActive',    String(ACTIVE));
        window.location.href = link.getAttribute('href') + navQuery;
      });
    });

    function updateNav() {
      const p     = Math.min(Math.max(window.scrollY / TRANSITION_PX, 0), 1);
      const q     = Math.min(Math.max((window.scrollY - TRANSITION_PX) / SLIDE_PX, 0), 1);
      const scale = 1 - p * (1 - BASE_SCALE);

      if (q > 0 && slideDistance === null) {
        /* Marks scale about their left edge, so landing on the content-left
           boundary is just the distance between left edges. Neotone resolves to
           0 here, which is what keeps it anchored. */
        slideDistance = navLinks[0].getBoundingClientRect().left
                      - navLinks[ACTIVE].getBoundingClientRect().left;
      }

      const tx = slideDistance !== null ? slideDistance * q : 0;
      navItems.forEach((item, i) => {
        if (i === ACTIVE) {
          item.style.transform = `translateX(${tx}px) scale(${scale})`;
        } else {
          item.style.transform = `translateY(${-80 * p}px) scale(${inactiveScale})`;
          item.style.opacity   = 1 - p;
        }
      });
    }

    const prevActive = parseInt(sessionStorage.getItem('prevActive') ?? '-1', 10);
    sessionStorage.removeItem('prevActive');

    /* Entry animation, identical on every page including the landing page: this
       page's own mark is full size and every other mark is reduced. Arriving
       from another page, that page's mark starts full size and shrinks as this
       one grows, so the marks stay continuous across navigation. */
    navItems.forEach((item, i) => {
      item.style.transform = `scale(${i === prevActive ? 1 : BASE_SCALE})`;
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      navItems.forEach((item, i) => {
        const start = (i === prevActive) ? 1 : BASE_SCALE;
        const end   = (i === ACTIVE)     ? 1 : BASE_SCALE;
        if (start !== end) item.style.transition = `transform ${TRANSITION_MS}ms ease`;
        item.style.transform = `scale(${end})`;
      });
      setTimeout(() => {
        navItems.forEach(item => { item.style.transition = ''; });
      }, TRANSITION_MS + 100);
    }));

    window.addEventListener('scroll', updateNav, { passive: true });
    /* Marks move on resize, so the cached slide target must be recomputed. */
    window.addEventListener('resize', () => { slideDistance = null; updateNav(); });

    /* ---- Footer ---- */
    function handleSearch(e) {
      e.preventDefault();
      alert(
        "Function: Site search\n\n" +
        "Queries a client-side JSON index of article metadata: title, kicker, date, container, first line. " +
        "The same index drives load-more in the containers, and is what a Tonefield issue is assembled from."
      );
    }
    function utilityLink(name) {
      alert(
        "Destination: " + name + "\n\n" +
        (name === 'Workshop'
          ? "An article, not a utility page: the photographed workshop piece with everyone named. It earns a footer permalink because it is evergreen."
          : "A utility page. Renders identically to an article, but carries the plain Neotone mark since it has no container to return to.")
      );
    }
    /* Footer section links return to the top before switching page. From the
       footer the masthead is collapsed, so navigating straight away would land
       on a page whose entry animation starts from a full-size mark, which reads as a jump.
       Scrolling up first lets the mark expand, and the cross-page animation
       then continues from the state actually on screen. */
    function scrollToTopThen(after) {
      const run = () => { if (after) after(); };
      if (window.scrollY <= 0) { run(); return; }

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        window.removeEventListener('scroll', onScroll);
        clearTimeout(safety);
        setTimeout(run, 140);          // brief hold on the expanded masthead
      };
      const onScroll = () => { if (window.scrollY <= 0) finish(); };
      window.addEventListener('scroll', onScroll, { passive: true });
      // covers smooth scrolling being disabled, instant, or interrupted
      const safety = setTimeout(finish, 1200);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.footer-section-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const href = link.getAttribute('href');
        const here = location.pathname.split('/').pop() || 'index.html';
        if (href === here) { scrollToTopThen(null); return; }   // already here: just return to top
        scrollToTopThen(() => {
          sessionStorage.setItem('prevActive', String(ACTIVE));
          window.location.href = href + navQuery;
        });
      });
    });

  </script>

</body>
</html>
